<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SparkChat — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />
</head>
<body>

<!-- Animated background blobs -->
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>

<div class="page-wrap">
    <!-- Brand -->
    <header class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 3L33 28H3L18 3Z" fill="url(#g1)"/>
                <path d="M18 12L27 28H9L18 12Z" fill="rgba(255,255,255,0.25)"/>
                <defs>
                    <linearGradient id="g1" x1="3" y1="28" x2="33" y2="3" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FF6B35"/>
                        <stop offset="1" stop-color="#FF3D6E"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <span class="brand-name">SparkChat</span>
    </header>

    <!-- Card -->
    <div class="card">
        <!-- Tab switcher -->
        <div class="tabs">
            <button class="tab active" data-tab="login">Sign In</button>
            <button class="tab" data-tab="signup">Create Account</button>
            <div class="tab-indicator"></div>
        </div>

        <!-- Error banner -->
        <div class="error-banner" id="errorBanner" hidden>
            <span class="error-icon">⚠</span>
            <span id="errorText"></span>
        </div>

        <!-- ── LOGIN FORM ── -->
        <form class="auth-form active" id="loginForm" autocomplete="on">
            <div class="field">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required />
            </div>
            <div class="field">
                <label for="loginPassword">Password</label>
                <div class="password-wrap">
                    <input type="password" id="loginPassword" placeholder="••••••••" required />
                    <button type="button" class="eye-btn" data-target="loginPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="spinner" hidden></span>
            </button>
        </form>

        <!-- ── SIGNUP FORM ── -->
        <form class="auth-form" id="signupForm" autocomplete="off">
            <div class="field">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" placeholder="spark_user" maxlength="24" required />
            </div>
            <div class="field">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="you@example.com" required />
            </div>
            <div class="field">
                <label for="signupPassword">Password</label>
                <div class="password-wrap">
                    <input type="password" id="signupPassword" placeholder="min. 6 characters" required minlength="6"/>
                    <button type="button" class="eye-btn" data-target="signupPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="signupBtn">
                <span class="btn-text">Create Account</span>
                <span class="spinner" hidden></span>
            </button>
        </form>

        <!-- Divider -->
        <div class="divider"><span>or</span></div>

        <!-- Google -->
        <button class="btn-google" id="googleBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>
    </div>

    <p class="footer-note">By continuing you agree to SparkChat's <a href="#">Terms</a> &amp; <a href="#">Privacy</a></p>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
